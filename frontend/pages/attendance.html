<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Attendance - Smart Attendance System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="app-shell">
    <div id="app-sidebar" class="sidebar"></div>

    <div class="main-wrapper">
      <div id="app-header" class="top-header"></div>

      <div class="main-content">
        <!-- Attendance Session Selection Bar -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-header">
            <div class="card-title">
              <i class="fas fa-sliders-h text-primary"></i>
              Attendance Session Configuration
            </div>
          </div>
          <div class="card-body">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Subject</label>
                <select id="attendanceSubjectSelect" class="form-select"></select>
              </div>

              <div class="form-group">
                <label class="form-label">Class Section</label>
                <select id="attendanceSectionSelect" class="form-select"></select>
              </div>

              <div class="form-group">
                <label class="form-label">Attendance Date</label>
                <input type="date" id="attendanceDateInput" class="form-control">
              </div>

              <div class="form-group">
                <label class="form-label">Session</label>
                <select id="attendanceSessionSelect" class="form-select">
                  <option value="Lecture 1 (09:00 - 10:00 AM)">Lecture 1 (09:00 - 10:00 AM)</option>
                  <option value="Lecture 2 (10:00 - 11:00 AM)">Lecture 2 (10:00 - 11:00 AM)</option>
                  <option value="Lab Session 1 (11:15 - 01:15 PM)">Lab Session 1 (11:15 - 01:15 PM)</option>
                  <option value="Lecture 3 (02:00 - 03:00 PM)">Lecture 3 (02:00 - 03:00 PM)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Attendance Real-Time Live Statistics Header -->
        <div class="metrics-grid" style="margin-bottom: 1.5rem;">
          <div class="metric-card primary">
            <div class="metric-info">
              <span class="metric-label">Enrolled Students</span>
              <span class="metric-value" id="statTotalEnrolled">0</span>
            </div>
            <div class="metric-icon"><i class="fas fa-users"></i></div>
          </div>

          <div class="metric-card success">
            <div class="metric-info">
              <span class="metric-label">Marked Present</span>
              <span class="metric-value text-success" id="statPresentCount">0</span>
            </div>
            <div class="metric-icon"><i class="fas fa-user-check"></i></div>
          </div>

          <div class="metric-card danger">
            <div class="metric-info">
              <span class="metric-label">Marked Absent</span>
              <span class="metric-value text-danger" id="statAbsentCount">0</span>
            </div>
            <div class="metric-icon"><i class="fas fa-user-times"></i></div>
          </div>

          <div class="metric-card info">
            <div class="metric-info">
              <span class="metric-label">Session Attendance %</span>
              <span class="metric-value" id="statSessionPercentage">100%</span>
            </div>
            <div class="metric-icon"><i class="fas fa-percentage"></i></div>
          </div>
        </div>

        <!-- Bulk Action & Toggle Bar -->
        <div class="toolbar">
          <div class="filter-group">
            <button class="btn btn-sm btn-success" onclick="AttendanceModule.markAll('PRESENT')">
              <i class="fas fa-check-double"></i> Mark All Present
            </button>
            <button class="btn btn-sm btn-danger" onclick="AttendanceModule.markAll('ABSENT')">
              <i class="fas fa-times-circle"></i> Mark All Absent
            </button>
          </div>

          <button class="btn btn-lg btn-primary" id="submitAttendanceBtn">
            <i class="fas fa-save"></i> Submit Attendance Records
          </button>
        </div>

        <!-- Student Attendance Grid -->
        <div id="attendanceStudentsContainer" class="dashboard-grid-2">
          <!-- Populated by JS -->
        </div>

      </div>

      <footer class="app-footer">
        <div>Smart Attendance Management System &copy; 2026</div>
        <div>Faculty Portal</div>
      </footer>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/attendance.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AttendanceModule.init();
    });
  </script>
</body>
</html>
