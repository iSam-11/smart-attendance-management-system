<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Attendance Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: var(--border-radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--border-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      box-shadow: var(--shadow-glow);
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
    }
    .demo-roles-box {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    .demo-btn {
      margin: 0.2rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      border-radius: var(--border-radius-full);
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .demo-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-card animate-fade-in">
    <div class="login-brand">
      <div class="brand-logo">SA</div>
      <div>
        <div class="brand-title">Smart Attendance</div>
        <div class="text-muted" style="font-size: 0.75rem; color: #94a3b8;">College Management Portal</div>
      </div>
    </div>

    <h2 style="font-size: 1.25rem; margin-bottom: 0.3rem; text-align: center;">Welcome Back</h2>
    <p class="text-muted" style="font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; color: #94a3b8;">
      Enter your institutional credentials to log in.
    </p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" style="color: #cbd5e1;">Username / Email</label>
        <div class="search-box" style="max-width: 100%;">
          <i class="fas fa-envelope" style="color: #64748b;"></i>
          <input type="text" id="loginUsername" class="form-control" placeholder="admin@college.edu or roll number" required style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); color: #ffffff;">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" style="color: #cbd5e1;">Password</label>
        <div class="search-box" style="max-width: 100%;">
          <i class="fas fa-lock" style="color: #64748b;"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); color: #ffffff;">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="demo-roles-box">
      <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 600;">1-Click Demo Login:</div>
      <button class="demo-btn" onclick="AuthService.switchDemoRole('ADMIN')">
        <i class="fas fa-user-shield"></i> Admin View
      </button>
      <button class="demo-btn" onclick="AuthService.switchDemoRole('FACULTY')">
        <i class="fas fa-chalkboard-teacher"></i> Faculty View
      </button>
      <button class="demo-btn" onclick="AuthService.switchDemoRole('STUDENT')">
        <i class="fas fa-user-graduate"></i> Student View
      </button>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await ApiService.login(username, password);
        AuthService.setSession(res.access_token, res.user);
        AppUtils.showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (res.user.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
          else if (res.user.role === 'FACULTY') window.location.href = 'faculty-dashboard.html';
          else window.location.href = 'student-dashboard.html';
        }, 800);
      } catch (err) {
        AppUtils.showToast('Invalid credentials. Please try again.', 'danger');
      }
    });
  </script>
</body>
</html>
